pluginGroup = com.pino
pluginVersion = 0.1.4

# Plugin compatibility: no upper bound, and a lower bound matching the platform below.
# The APIs used (MultiHostInjector / PSI) are stable, so building against an older
# platformVersion and lowering pluginSinceBuild to match is enough to support older IDEs.
pluginSinceBuild = 242

# Java release the plugin is compiled for. Must match what the target platform requires:
# 25 for 2026.2, 21 for 2024.2-2026.1.
javaVersion = 25

# Platform used to compile against and to run `runIde`.
# JPQL (JPAQL) support only exists in IntelliJ IDEA Ultimate.
platformType = IU
platformVersion = 2026.2.2

org.gradle.jvmargs = -Xmx2g -XX:MaxMetaspaceSize=768m
org.gradle.caching = true
org.gradle.configuration-cache = false
kotlin.stdlib.default.dependency = false
